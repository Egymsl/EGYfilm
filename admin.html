<script>
  let editingFilmId = null; // متغير بيعرفنا هل بنضيف جديد ولا بنعدل

  // 1. دالة لجلب الأفلام وعرضها في لوحة التحكم مع زرار التعديل والحذف
  function loadMovies() {
    db.collection('movies').onSnapshot((snapshot) => {
      const listContainer = document.getElementById('moviesList'); // تأكد إن عندك div بالـ ID ده
      listContainer.innerHTML = '';

      snapshot.forEach((doc) => {
        const movie = doc.data();
        listContainer.innerHTML += `
          <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; align-items: center; gap: 10px;">
            <img src="${movie.poster}" width="60" style="border-radius: 5px;">
            <div style="flex-grow: 1;">
              <h4>${movie.title}</h4>
            </div>
            <!-- زرار التعديل اللي بيملى الخانات فوق -->
            <button onclick="prepareEdit('${doc.id}', '${movie.title}', '${movie.poster}', '${movie.videoUrl}')">✏️ تعديل</button>
          </div>
        `;
      });
    });
  }

  // 2. دالة الضغط على زر التعديل (بتنزل البيانات في الخانات فوق)
  function prepareEdit(id, title, poster, videoUrl) {
    document.getElementById('titleInput').value = title;
    document.getElementById('posterInput').value = poster;
    document.getElementById('videoUrlInput').value = videoUrl;

    editingFilmId = id; // بنحفظ رقم الفيلم
    document.getElementById('saveBtn').innerText = "تحديث البيانات 🔄"; // بنغير اسم الزرار
  }

  // 3. دالة الحفظ (بتعرف أوتوماتيك هل هتضيف جديد ولا هتعدل)
  async function saveFilm() {
    const title = document.getElementById('titleInput').value;
    const poster = document.getElementById('posterInput').value;
    const videoUrl = document.getElementById('videoUrlInput').value;

    if (!title || !poster || !videoUrl) {
      alert("تأكد من ملء كل الخانات!");
      return;
    }

    if (editingFilmId) {
      // لو فيه ID محفوظة -> تعديل فيلم قديم
      await db.collection('movies').doc(editingFilmId).update({
        title: title,
        poster: poster,
        videoUrl: videoUrl
      });
      alert("تم تحديث البوستر/البيانات بنجاح! ✅");
      editingFilmId = null; // نرجع الوضع لإضافة جديد
      document.getElementById('saveBtn').innerText = "إضافة فيلم ➕";
    } else {
      // لو مفيش ID -> إضافة فيلم جديد
      await db.collection('movies').add({
        title: title,
        poster: poster,
        videoUrl: videoUrl
      });
      alert("تمت إضافة الفيلم بنجاح! 🎉");
    }

    // تفريغ الخانات
    document.getElementById('titleInput').value = '';
    document.getElementById('posterInput').value = '';
    document.getElementById('videoUrlInput').value = '';
  }

  // تشغيل عرض الأفلام أوتوماتيك
  loadMovies();
</script>
