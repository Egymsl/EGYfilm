<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGYfilm - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e50914;
            --bg: #0c0d10;
            --card: #181a20;
            --text: #ffffff;
            --gray: #9e9e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .admin-card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--red);
            font-weight: 900;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ddd;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #22252e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--red);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .series-fields {
            display: none;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        button {
            width: 100%;
            background: var(--red);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #b80710;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>إضافة محتوى جديد لـ EgyFilm</h2>
        
        <form id="addForm">
            <div class="form-group">
                <label>نوع المحتوى</label>
                <select id="contentType" onchange="toggleSeriesFields()">
                    <option value="movie">فيلم</option>
                    <option value="series">مسلسل</option>
                </select>
            </div>

            <div class="form-group">
                <label>التصنيف واللغة</label>
                <select id="category">
                    <option value="movie-ar">أفلام عربية</option>
                    <option value="movie-en">أفلام أجنبية</option>
                    <option value="series-ar">مسلسلات عربية</option>
                    <option value="series-en">مسلسلات أجنبية</option>
                </select>
            </div>

            <div class="form-group">
                <label>الاسم / العنوان</label>
                <input type="text" id="title" placeholder="مثال: Toy Story 5" required>
            </div>

            <!-- خانات المسلسلات -->
            <div class="series-fields" id="seriesFields">
                <div class="row">
                    <div style="flex:1;">
                        <label>رقم الموسم</label>
                        <input type="number" id="season" placeholder="1">
                    </div>
                    <div style="flex:1;">
                        <label>رقم الحلقة</label>
                        <input type="number" id="episode" placeholder="1">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>رابط البوستر (URL)</label>
                <input type="url" id="poster" placeholder="https://..." required>
            </div>

            <div class="form-group">
                <label>رابط السيرفر / الفيديو (Embed URL)</label>
                <input type="url" id="videoUrl" placeholder="https://..." required>
            </div>

            <button type="submit" id="submitBtn">حفظ ونشر المحتوى 🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function toggleSeriesFields() {
            const type = document.getElementById('contentType').value;
            const seriesFields = document.getElementById('seriesFields');
            const categorySelect = document.getElementById('category');

            if (type === 'series') {
                seriesFields.style.display = 'block';
                categorySelect.value = 'series-ar';
            } else {
                seriesFields.style.display = 'none';
                categorySelect.value = 'movie-ar';
            }
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'جاري الحفظ...';

            const type = document.getElementById('contentType').value;
            const data = {
                title: document.getElementById('title').value,
                poster: document.getElementById('poster').value,
                videoUrl: document.getElementById('videoUrl').value,
                type: type,
                category: document.getElementById('category').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (type === 'series') {
                data.season = document.getElementById('season').value || 1;
                data.episode = document.getElementById('episode').value || 1;
            }

            db.collection("movies").add(data).then(() => {
                alert('تم إضافة المحتوى بنجاح!');
                document.getElementById('addForm').reset();
                toggleSeriesFields();
                btn.disabled = false;
                btn.innerText = 'حفظ ونشر المحتوى 🚀';
            }).catch((err) => {
                alert('حدث خطأ: ' + err.message);
                btn.disabled = false;
                btn.innerText = 'حفظ ونشر المحتوى 🚀';
            });
        });
    </script>
</body>
</html>
