<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - EGYfilm</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; }
    .form-container { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto 20px auto; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; box-sizing: border-box; background: #2a2a2a; color: #fff; }
    button { background-color: #e50914; font-weight: bold; cursor: pointer; border: none; font-size: 16px; }
    .movie-card { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; border: 1px solid #333; }
    .movie-card img { width: 50px; height: 75px; object-fit: cover; border-radius: 4px; }
    .movie-info { flex-grow: 1; }
    .edit-btn { background-color: #007bff; width: auto; padding: 6px 15px; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <div class="form-container">
    <h2>إدارة المحتوى 🎬</h2>
    <input type="text" id="titleInput" placeholder="اسم الفيلم / المسلسل">
    <input type="text" id="posterInput" placeholder="رابط البوستر (.jpg / .png)">
    <input type="text" id="videoUrlInput" placeholder="رابط الفيديو (Embed URL)">
    
    <!-- قائمة اختيار القسم -->
    <select id="categoryInput">
      <option value="arabic-movie">فيلم عربي</option>
      <option value="english-movie">فيلم أجنبي</option>
      <option value="arabic-series">مسلسل عربي</option>
      <option value="english-series">مسلسل أجنبي</option>
    </select>
    
    <button id="saveBtn" onclick="saveFilm()">إضافة المحتوى ➕</button>
  </div>

  <h3>المحتوى المضاف:</h3>
  <div id="moviesList">جاري التحميل...</div>

  <script>
    // ⚠️ حط بيانات الفايربيس بتاعتك أنت هنا عشان يقرأ الأفلام القديمة!
    const firebaseConfig = {
      apiKey: "ضع_الـ_API_KEY_بتاعك",
      authDomain: "ضع_الـ_AUTH_DOMAIN_بتاعك",
      projectId: "ضع_الـ_PROJECT_ID_بتاعك",
      storageBucket: "ضع_الـ_STORAGE_BUCKET_بتاعك",
      messagingSenderId: "ضع_الـ_MESSAGING_SENDER_ID_بتاعك",
      appId: "ضع_الـ_APP_ID_بتاعك"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let editingFilmId = null;

    function loadMovies() {
      db.collection('movies').onSnapshot((snapshot) => {
        const listContainer = document.getElementById('moviesList');
        listContainer.innerHTML = '';

        if (snapshot.empty) {
          listContainer.innerHTML = '<p>لا توجد أفلام مضافة بعد.</p>';
          return;
        }

        snapshot.forEach((doc) => {
          const movie = doc.data();
          listContainer.innerHTML += `
            <div class="movie-card">
              <img src="${movie.poster}" alt="${movie.title}">
              <div class="movie-info">
                <h4>${movie.title}</h4>
                <small style="color: #aaa;">القسم: ${movie.category || 'غير محدد'}</small>
              </div>
              <button class="edit-btn" onclick="prepareEdit('${doc.id}', '${movie.title}', '${movie.poster}', '${movie.videoUrl}', '${movie.category || 'arabic-movie'}')">✏️ تعديل</button>
            </div>
          `;
        });
      }, (error) => {
        document.getElementById('moviesList').innerHTML = '<p style="color: red;">خطأ في الاتصال بالفايربيس! تأكد من مفاتيح firebaseConfig.</p>';
      });
    }

    function prepareEdit(id, title, poster, videoUrl, category) {
      document.getElementById('titleInput').value = title;
      document.getElementById('posterInput').value = poster;
      document.getElementById('videoUrlInput').value = videoUrl;
      document.getElementById('categoryInput').value = category;

      editingFilmId = id;
      document.getElementById('saveBtn').innerText = "تحديث البيانات 🔄";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function saveFilm() {
      const title = document.getElementById('titleInput').value;
      const poster = document.getElementById('posterInput').value;
      const videoUrl = document.getElementById('videoUrlInput').value;
      const category = document.getElementById('categoryInput').value;

      if (!title || !poster || !videoUrl) {
        alert("يرجى ملء كافة الخانات!");
        return;
      }

      if (editingFilmId) {
        await db.collection('movies').doc(editingFilmId).update({ title, poster, videoUrl, category });
        alert("تم تحديث البيانات بنجاح! ✅");
        editingFilmId = null;
        document.getElementById('saveBtn').innerText = "إضافة المحتوى ➕";
      } else {
        await db.collection('movies').add({ title, poster, videoUrl, category });
        alert("تم إضافة المحتوى بنجاح! 🎉");
      }

      document.getElementById('titleInput').value = '';
      document.getElementById('posterInput').value = '';
      document.getElementById('videoUrlInput').value = '';
    }

    loadMovies();
  </script>
</body>
</html>
