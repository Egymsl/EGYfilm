<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGYfilm - مشاهدة الأفلام والمسلسلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e50914;
            --bg: #0c0d10;
            --card: #181a20;
            --card-hover: #22252e;
            --text: #ffffff;
            --gray: #9e9e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 60px;
        }

        /* الهيدر وشريط التنقل */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            color: var(--red);
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        /* أزرار التصفية والتقسيمات */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 5%;
            margin-top: 10px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--red);
            border-color: var(--red);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        /* واجهة العرض الرئيسية */
        main {
            padding: 10px 5%;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--red);
            border-radius: 2px;
        }

        /* شبكة عرض المحتوى */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover {
            transform: translateY(-8px);
            background: var(--card-hover);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(229, 9, 20, 0.2);
        }

        .poster-container {
            position: relative;
            width: 100%;
            height: 240px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            backdrop-filter: blur(5px);
        }

        .badge.series {
            background: rgba(229, 9, 20, 0.85);
        }

        .card-info {
            padding: 12px;
        }

        .card-info h3 {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 12px;
            color: var(--gray);
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: var(--gray);
            font-size: 16px;
        }

        /* نافذة المشغل */
        #playerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .iframe-container {
            width: 100%;
            max-width: 900px;
            height: 65vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">EGYfilm</a>
    </header>

    <!-- أزرار التصنيفات والفلترة -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterContent('all')">الكل</button>
        <button class="tab-btn" onclick="filterContent('movie-ar')">أفلام عربية</button>
        <button class="tab-btn" onclick="filterContent('movie-en')">أفلام أجنبية</button>
        <button class="tab-btn" onclick="filterContent('series-ar')">مسلسلات عربية</button>
        <button class="tab-btn" onclick="filterContent('series-en')">مسلسلات أجنبية</button>
    </div>

    <main>
        <h2 class="section-title" id="sectionTitle">أحدث الإضافات</h2>
        <div class="grid" id="contentGrid">
            <p class="empty-msg">جاري تحميل المحتوى...</p>
        </div>
    </main>

    <!-- مشغل الفيديو السينمائي -->
    <div id="playerModal">
        <div class="modal-header">
            <h3 id="playingTitle" style="color:#fff;">مشاهدة المحتوى</h3>
            <button class="close-btn" onclick="closePlayer()">إغلاق ✖</button>
        </div>
        <div class="iframe-container">
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allData = [];

        // جلب البيانات مرة واحدة
        db.collection("movies").get().then((snapshot) => {
            allData = [];
            snapshot.forEach((doc) => {
                allData.push({ id: doc.id, ...doc.data() });
            });
            renderCards(allData);
        }).catch((error) => {
            document.getElementById('contentGrid').innerHTML = '<p class="empty-msg">حدث خطأ أثناء تحميل البيانات.</p>';
        });

        // دالة رسم الكروت
        function renderCards(items) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p class="empty-msg">لا يوجد محتوى متوفر في هذا القسم حالياً.</p>';
                return;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';

                const isSeries = item.type === 'series';
                let tagText = isSeries ? 'مسلسل' : 'فيلم';
                let subDetails = '';

                if (isSeries) {
                    let seasonStr = item.season ? `الموسم ${item.season}` : '';
                    let epStr = item.episode ? `الحلقة ${item.episode}` : '';
                    subDetails = [seasonStr, epStr].filter(Boolean).join(' - ') || 'جميع الحلقات';
                } else {
                    subDetails = item.category === 'movie-ar' ? 'عربي' : 'أجنبي';
                }

                card.innerHTML = `
                    <div class="poster-container">
                        <span class="badge ${isSeries ? 'series' : ''}">${tagText}</span>
                        <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/180x250?text=No+Poster'">
                    </div>
                    <div class="card-info">
                        <h3>${item.title || 'بدون عنوان'}</h3>
                        <p>${subDetails}</p>
                    </div>
                `;

                card.onclick = () => playVideo(item.videoUrl, item.title);
                grid.appendChild(card);
            });
        }

        // دالة الفلترة والتصفية
        function filterContent(category) {
            // تحديث زرار الفلتر النشط
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderCards(allData);
            } else {
                const filtered = allData.filter(item => {
                    if (category.startsWith('movie')) {
                        return item.type === 'movie' && (item.category === category || !item.category);
                    } else if (category.startsWith('series')) {
                        return item.type === 'series' && (item.category === category || !item.category);
                    }
                    return item.category === category;
                });
                renderCards(filtered);
            }
        }

        function playVideo(url, title) {
            document.getElementById('playingTitle').innerText = title || 'مشاهدة';
            document.getElementById('videoIframe').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }
    </script>
</body>
</html>
