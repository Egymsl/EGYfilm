<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egymsl | نتفليكس الشرق الأوسط</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --netflix-red: #E50914;
            --netflix-dark-red: #B81D24;
            --bg-black: #141414;
            --card-bg: #181818;
            --card-hover: #282828;
            --text-white: #FFFFFF;
            --text-gray: #AAAAAA;
            --gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* Header & Brand Logo */
        header {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            font-size: 30px;
            font-weight: 900;
            text-decoration: none;
            color: var(--netflix-red);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo .sub-tag {
            font-size: 11px;
            background: var(--gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 0;
        }

        /* Netflix Hero Banner */
        .hero {
            position: relative;
            height: 60vh;
            min-height: 400px;
            background: linear-gradient(180deg, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.9) 80%, var(--bg-black) 100%), 
                        url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1400') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 0 5% 40px;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero-badge {
            background: var(--netflix-red);
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .hero-desc {
            color: var(--text-gray);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Navigation Categories Bar */
        .categories-nav {
            padding: 20px 5% 10px;
            position: sticky;
            top: 70px;
            z-index: 900;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(8px);
        }

        .tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 22px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--netflix-red);
            color: #fff;
            border-color: var(--netflix-red);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        /* Netflix Card Grid */
        main {
            padding: 20px 5%;
        }

        .section-header {
            margin: 20px 0 15px;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header::before {
            content: '';
            width: 5px;
            height: 24px;
            background: var(--netflix-red);
            border-radius: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 24px;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: scale(1.06) translateY(-5px);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(229, 9, 20, 0.3);
        }

        .poster-box {
            position: relative;
            width: 100%;
            padding-top: 150%;
            background: #000;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            background: var(--netflix-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--netflix-red);
        }

        .play-btn::after {
            content: '';
            width: 0; height: 0;
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: -3px;
        }

        .card:hover .play-overlay { opacity: 1; }

        .card-info {
            padding: 12px;
        }

        .card-info h3 {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info .type-tag {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            color: var(--text-gray);
            font-size: 16px;
        }

        /* Fullscreen Modal Cinema Player */
        #playerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 20px; font-weight: 800; }

        .close-btn {
            background: var(--netflix-red);
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="brand-logo">Egymsl <span class="sub-tag">PRO</span></a>
    </header>

    <!-- Netflix Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge">شاهد الآن</span>
            <h1 class="hero-title">عالم من الترفيه بلا حدود</h1>
            <p class="hero-desc">استمتع بأحدث الأفلام والمسلسلات حصرياً على منصة Egymsl بجودة عالية وبدون إعلانات.</p>
        </div>
    </section>

    <!-- Categories Nav Bar -->
    <div class="categories-nav">
        <div class="tabs">
            <button class="tab-btn active" onclick="filterContent('all', this)">الكل</button>
            <button class="tab-btn" onclick="filterContent('movie-ar', this)">أفلام عربية</button>
            <button class="tab-btn" onclick="filterContent('movie-en', this)">أفلام أجنبية</button>
            <button class="tab-btn" onclick="filterContent('series-ar', this)">مسلسلات عربية</button>
            <button class="tab-btn" onclick="filterContent('series-en', this)">مسلسلات أجنبية</button>
        </div>
    </div>

    <!-- Main Movies Section -->
    <main>
        <h2 class="section-header">المحتوى المتاح</h2>
        <div class="grid" id="contentGrid">
            <p class="empty-msg">جاري تحميل المكتبة السينمائية...</p>
        </div>
    </main>

    <!-- Cinema Video Modal Player -->
    <div id="playerModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title" id="playingTitle">مشاهدة الفيلم</h3>
                <button class="close-btn" onclick="closePlayer()">إغلاق ✖</button>
            </div>
            <div class="video-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allData = [];

        // Fetch Movies from Firestore
        db.collection("movies").onSnapshot((snapshot) => {
            allData = [];
            snapshot.forEach((doc) => {
                allData.push({ id: doc.id, ...doc.data() });
            });
            renderCards(allData);
        }, (err) => {
            document.getElementById('contentGrid').innerHTML = '<p class="empty-msg">عذراً، تعذر جلب البيانات.</p>';
        });

        // Render Netflix Cards
        function renderCards(items) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p class="empty-msg">لا يوجد محتوى متاح حالياً في هذا التصنيف.</p>';
                return;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';

                const isSeries = item.type === 'series' || (item.category && item.category.startsWith('series'));
                const typeText = isSeries ? 'مسلسل' : 'فيلم';

                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x450/181818/FFFFFF?text=Egymsl'">
                        <div class="play-overlay">
                            <div class="play-btn"></div>
                        </div>
                    </div>
                    <div class="card-info">
                        <h3>${item.title || 'بدون عنوان'}</h3>
                        <div class="type-tag">${typeText}</div>
                    </div>
                `;

                card.onclick = () => playVideo(item.videoUrl, item.title);
                grid.appendChild(card);
            });
        }

        // Category Filter Function
        function filterContent(category, btnElement) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (category === 'all') {
                renderCards(allData);
            } else {
                const filtered = allData.filter(item => item.category === category);
                renderCards(filtered);
            }
        }

        function playVideo(url, title) {
            if (!url) return alert('رابط الفيديو غير متوفر!');
            document.getElementById('playingTitle').innerText = title || 'مشاهدة العرض';
            document.getElementById('videoIframe').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }
    </script>
</body>
</html>
