<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgyFilm - مشاهدة الأفلام والمسلسلات</title>
    <style>
        body { font-family: sans-serif; background-color: #141414; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #e50914; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .card { background: #222; border-radius: 8px; overflow: hidden; width: 180px; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card h3 { font-size: 14px; margin: 10px; color: #fff; }
        .card span { font-size: 12px; color: #aaa; display: block; margin-bottom: 10px; }
        /* Player Modal */
        #playerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        #playerModal iframe { width: 80%; height: 80%; border: none; }
        .close-btn { background: #e50914; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>EGYfilm</h1>
    <div class="grid" id="contentGrid">جاري تحميل المحتوى...</div>

    <!-- Modal المشغل -->
    <div id="playerModal">
        <button class="close-btn" onclick="closePlayer()">إغلاق ✖</button>
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const grid = document.getElementById('contentGrid');

        db.collection("movies").orderBy("createdAt", "desc").get().then((snapshot) => {
            grid.innerHTML = '';
            if (snapshot.empty) {
                grid.innerHTML = '<p>لا يوجد محتوى حالياً، قم بإنشاء أول فيلم من لوحة التحكم!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'card';
                
                let subText = item.type === 'series' ? `موسم ${item.season} - حلقة ${item.episode}` : 'فيلم 🎬';
                
                card.innerHTML = `
                    <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/180x250?text=No+Image'">
                    <h3>${item.title}</h3>
                    <span>${subText}</span>
                `;
                
                card.onclick = () => playVideo(item.videoUrl);
                grid.appendChild(card);
            });
        }).catch((error) => {
            grid.innerHTML = 'حدث خطأ أثناء تحميل البيانات: ' + error.message;
        });

        function playVideo(url) {
            document.getElementById('videoIframe').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }
    </script>
</body>
</html>
