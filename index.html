<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGYfilm | ايجي فيلم - عالم من الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E50914;
            --shahid-gold: #FFC107;
            --bg: #0A0B0E;
            --card-bg: #14161D;
            --card-hover: #1E212B;
            --text-main: #FFFFFF;
            --text-sub: #A0A5B5;
            --accent-glow: rgba(229, 9, 20, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* Navbar & Header */
        header {
            background: linear-gradient(180deg, rgba(10, 11, 14, 0.95) 0%, rgba(10, 11, 14, 0.8) 70%, transparent 100%);
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--red);
            text-shadow: 0 0 12px var(--red);
        }

        /* Hero Banner (Netflix Style) */
        .hero {
            position: relative;
            height: 55vh;
            min-height: 380px;
            background: linear-gradient(180deg, rgba(10,11,14,0.2) 0%, rgba(10,11,14,0.8) 70%, var(--bg) 100%), 
                        url('https://images.unsplash.com/photo-1616530940355-351fabd9524b?q=80&w=1200') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 0 6% 30px;
            margin-top: 50px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-desc {
            color: var(--text-sub);
            font-size: 14px;
            max-width: 500px;
            line-height: 1.6;
        }

        /* Horizontal Categories Bar (Shahid Style) */
        .categories-wrapper {
            padding: 15px 6% 5px;
            position: sticky;
            top: 65px;
            z-index: 900;
            background: var(--bg);
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
            box-shadow: 0 4px 18px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* Content Grid */
        main {
            padding: 10px 6%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 25px 0 15px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            background: var(--red);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 18px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 22px;
            }
        }

        /* Premium Movie Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.35s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            background: var(--card-hover);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 20px var(--accent-glow);
            border-color: rgba(229, 9, 20, 0.4);
        }

        .poster-box {
            position: relative;
            width: 100%;
            padding-top: 145%; /* Aspect ratio 1:1.45 */
            background: #101217;
            overflow: hidden;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        /* Play Overlay Button */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-icon {
            width: 45px;
            height: 45px;
            background: var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--red);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: -3px;
        }

        .card:hover .play-overlay {
            opacity: 1;
        }

        .card:hover .play-icon {
            transform: scale(1);
        }

        .badge-type {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(10, 11, 14, 0.85);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .badge-type.series {
            background: rgba(229, 9, 20, 0.9);
        }

        .card-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-details h3 {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .card-details .sub {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            color: var(--text-sub);
            font-size: 15px;
        }

        /* Cinema Modal Player */
        #playerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 6, 8, 0.96);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .modal-box {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .close-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <a href="#" class="logo">EGY<span>FILM</span></a>
    </header>

    <!-- Hero Showcase Section -->
    <section class="hero">
        <div>
            <h1 class="hero-title">عالم من السينما بين يديك</h1>
            <p class="hero-desc">شاهد أحدث الأفلام والمسلسلات العربية والأجنبية بجودة عالية وبدون إعلانات مزعجة.</p>
        </div>
    </section>

    <!-- Category Filters (Shahid Style) -->
    <div class="categories-wrapper">
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterContent('all', this)">الكل</button>
            <button class="tab-btn" onclick="filterContent('movie-ar', this)">أفلام عربية</button>
            <button class="tab-btn" onclick="filterContent('movie-en', this)">أفلام أجنبية</button>
            <button class="tab-btn" onclick="filterContent('series-ar', this)">مسلسلات عربية</button>
            <button class="tab-btn" onclick="filterContent('series-en', this)">مسلسلات أجنبية</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">أحدث الإضافات</h2>
        </div>

        <div class="grid" id="contentGrid">
            <p class="empty-msg">جاري التحميل المباشر من المكتبيّة...</p>
        </div>
    </main>

    <!-- Fullscreen Cinema Video Player -->
    <div id="playerModal">
        <div class="modal-box">
            <div class="modal-top">
                <h3 class="modal-title" id="playingTitle">مشاهدة العرض</h3>
                <button class="close-btn" onclick="closePlayer()">إغلاق ✖</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allData = [];

        // جلب البيانات من المجموعات
        db.collection("movies").get().then((snapshot) => {
            allData = [];
            snapshot.forEach((doc) => {
                allData.push({ id: doc.id, ...doc.data() });
            });
            renderCards(allData);
        }).catch((err) => {
            document.getElementById('contentGrid').innerHTML = '<p class="empty-msg">عذراً، تعذر تحميل البيانات من السيرفر.</p>';
        });

        // رسم كروت نتفليكس / شاهد
        function renderCards(items) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p class="empty-msg">لا يوجد محتوى متاح حالياً في هذا التصنيف.</p>';
                return;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';

                const isSeries = item.type === 'series';
                let tagText = isSeries ? 'مسلسل' : 'فيلم';
                let subDetails = '';

                if (isSeries) {
                    let s = item.season ? `الموسم ${item.season}` : '';
                    let e = item.episode ? `الحلقة ${item.episode}` : '';
                    subDetails = [s, e].filter(Boolean).join(' • ') || 'حلقات كاملة';
                } else {
                    subDetails = item.category === 'movie-ar' ? 'عربي' : 'أجنبي';
                }

                card.innerHTML = `
                    <div class="poster-box">
                        <span class="badge-type ${isSeries ? 'series' : ''}">${tagText}</span>
                        <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x450/14161D/FFFFFF?text=No+Poster'">
                        <div class="play-overlay">
                            <div class="play-icon"></div>
                        </div>
                    </div>
                    <div class="card-details">
                        <h3>${item.title || 'بدون عنوان'}</h3>
                        <div class="sub">${subDetails}</div>
                    </div>
                `;

                card.onclick = () => playVideo(item.videoUrl, item.title);
                grid.appendChild(card);
            });
        }

        // فلترة التصنيفات
        function filterContent(category, btnElement) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (category === 'all') {
                renderCards(allData);
            } else {
                const filtered = allData.filter(item => {
                    if (category.startsWith('movie')) {
                        return item.type === 'movie' && (item.category === category || !item.category);
                    } else if (category.startsWith('series')) {
                        return item.type === 'series' && (item.category === category || !item.category);
                    }
                    return item.category === category;
                });
                renderCards(filtered);
            }
        }

        function playVideo(url, title) {
            if (!url) return alert('رابط المشغل غير متوفر لهذا العرض!');
            document.getElementById('playingTitle').innerText = title || 'مشاهدة الفيلم';
            document.getElementById('videoIframe').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }
    </script>
</body>
</html>
