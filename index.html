<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egymsl | ايجي مثل - عالم من الترفيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E50914;
            --bg-black: #141414;
            --card-bg: #181818;
            --text-white: #FFFFFF;
            --text-gray: #AAAAAA;
            --gold: #FFD700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-white); padding-bottom: 50px; }

        header {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
            padding: 18px 5%; display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; backdrop-filter: blur(10px);
        }

        .brand-logo { font-size: 28px; font-weight: 900; color: var(--red); text-decoration: none; }
        .brand-logo span { color: #fff; }

        .hero {
            height: 55vh; min-height: 380px;
            background: linear-gradient(180deg, rgba(20,20,20,0.2) 0%, var(--bg-black) 100%), 
                        url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1400') center/cover;
            display: flex; align-items: flex-end; padding: 0 5% 30px;
        }

        .hero-title { font-size: 32px; font-weight: 900; }

        .categories-nav { padding: 15px 5%; position: sticky; top: 65px; z-index: 900; background: rgba(20,20,20,0.95); }
        .tabs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .tab-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-weight: 700; }
        .tab-btn.active { background: var(--red); }

        main { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }

        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .poster-box { position: relative; width: 100%; padding-top: 150%; background: #000; }
        .card img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; font-weight: bold; }

        /* Modal Player */
        #playerModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 2000; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto;
        }
        .modal-box { width: 100%; max-width: 900px; }
        .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        .video-container iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border: none; }
        .episodes-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .ep-btn { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .ep-btn.active { background: var(--red); font-weight: bold; }
        .close-btn { background: var(--red); color: #fff; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; float: left; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo">EGY<span>MSL</span></a>
    </header>

    <section class="hero">
        <div>
            <h1 class="hero-title">Egymsl | عالم المسلسلات والأفلام</h1>
        </div>
    </section>

    <div class="categories-nav">
        <div class="tabs">
            <button class="tab-btn active" onclick="filterContent('all', this)">الكل</button>
            <button class="tab-btn" onclick="filterContent('movie-ar', this)">أفلام عربية</button>
            <button class="tab-btn" onclick="filterContent('movie-en', this)">أفلام أجنبية</button>
            <button class="tab-btn" onclick="filterContent('series-ar', this)">مسلسلات عربية</button>
            <button class="tab-btn" onclick="filterContent('series-en', this)">مسلسلات أجنبية</button>
        </div>
    </div>

    <main>
        <div class="grid" id="contentGrid"></div>
    </main>

    <!-- Player Modal -->
    <div id="playerModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closePlayer()">إغلاق ✖</button>
            <h2 id="playingTitle" style="clear:both; padding-top:10px;"></h2>
            
            <!-- قائمة الحلقات (تظهر فقط للمسلسلات) -->
            <div id="episodesBox" style="display:none;">
                <p style="margin-top:10px; color:var(--text-gray);">اختر الحلقة:</p>
                <div class="episodes-list" id="episodesList"></div>
            </div>

            <div class="video-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC2g1Gf-xfNJqyEwTjGThiWBwNMcx421hU",
          authDomain: "egyfilm-f3cdd.firebaseapp.com",
          projectId: "egyfilm-f3cdd",
          storageBucket: "egyfilm-f3cdd.firebasestorage.app",
          messagingSenderId: "370903201028",
          appId: "1:370903201028:web:ef0d107d7308ca489b0c51"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allData = [];

        db.collection("movies").onSnapshot((snapshot) => {
            allData = [];
            snapshot.forEach((doc) => allData.push({ id: doc.id, ...doc.data() }));
            renderCards(allData);
        });

        function renderCards(items) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';
            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${item.poster}" alt="${item.title}">
                    </div>
                    <div class="card-info">${item.title}</div>
                `;
                card.onclick = () => openMedia(item);
                grid.appendChild(card);
            });
        }

        function openMedia(item) {
            document.getElementById('playingTitle').innerText = item.title;
            const epBox = document.getElementById('episodesBox');
            const epList = document.getElementById('episodesList');
            epList.innerHTML = '';

            if (item.type === 'series' && item.episodes && item.episodes.length > 0) {
                epBox.style.display = 'block';
                item.episodes.forEach((ep, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn' + (idx === 0 ? ' active' : '');
                    btn.innerText = `موسم ${ep.season} - حلقة ${ep.episode}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById('videoIframe').src = ep.url;
                    };
                    epList.appendChild(btn);
                });
                // تشغيل أول حلقة تلقائياً
                document.getElementById('videoIframe').src = item.episodes[0].url;
            } else {
                epBox.style.display = 'none';
                document.getElementById('videoIframe').src = item.videoUrl || '';
            }

            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        function filterContent(category, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            if (category === 'all') renderCards(allData);
            else renderCards(allData.filter(item => item.category === category));
        }
    </script>
</body>
</html>
