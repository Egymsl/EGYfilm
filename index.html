<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGYMSL - منصة الأفلام والمسلسلات</title>
  <style>
    /* تنسيقات عامة أساسية */
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #1f1f1f;
    }
    .container {
      padding: 20px;
    }
    /* تنسيق النافذة (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #1a1a1a;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      padding: 20px;
      position: relative;
    }
    .close-btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      float: left;
    }
    /* حاوية المشغل الذكي */
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* نسبة عرض لارتفاع 16:9 */
      background: #000;
      margin-top: 15px;
      border-radius: 5px;
      overflow: hidden;
    }
    .video-container video,
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* تنسيق أزرار الحلقات */
    #episodesBox {
      margin-top: 15px;
      display: none;
    }
    .ep-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
      border-radius: 4px;
    }
    .ep-btn.active {
      background: #e50914;
    }
  </style>
</head>
<body>

  <header>
    <h1>EGYMSL</h1>
  </header>

  <div class="container">
    <h2>أحدث الأفلام والمسلسلات</h2>
    <!-- زر تجريبي لفتح نافذة الفيلم للتأكد من الكود -->
    <button onclick="openModal({title: 'Toy story5', type: 'movie', videoUrl: 'https://mp4plus.org/embed-142e5ehcao8j.html'})" style="padding: 10px 20px; background: #e50914; color: #fff; border: none; border-radius: 5px; cursor: pointer;">
      تجربة فتح الفيلم
    </button>
  </div>

  <!-- النافذة المنسدلة للمشغل -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h3 id="modalTitle" style="margin: 0; display: inline-block;"></h3>
      
      <!-- المشغل الذكي -->
      <div class="video-container" id="videoContainer"></div>

      <!-- قائمة الحلقات لو مسلسل -->
      <div id="episodesBox">
        <h4>الحلقات:</h4>
        <div id="episodesList"></div>
      </div>
    </div>
  </div>

  <script>
    function openModal(item) {
      document.getElementById('modalTitle').textContent = item.title || '';
      const epBox = document.getElementById('episodesBox');
      const epList = document.getElementById('episodesList');
      const videoContainer = document.getElementById('videoContainer');
      
      epList.innerHTML = '';
      let targetUrl = item.videoUrl || '';

      if (item.type === 'series' && item.episodes && item.episodes.length > 0) {
        epBox.style.display = 'block';
        item.episodes.forEach((ep, idx) => {
          const btn = document.createElement('button');
          btn.className = 'ep-btn' + (idx === 0 ? ' active' : '');
          btn.innerText = `حلقة ${ep.episode}`;
          btn.onclick = () => {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSmartPlayer(ep.url, videoContainer);
          };
          epList.appendChild(btn);
        });
        targetUrl = item.episodes[0].url;
      } else {
        epBox.style.display = 'none';
      }

      renderSmartPlayer(targetUrl, videoContainer);
      document.getElementById('modal').classList.add('show');
    }

    // دالة المشغل الذكي: تفصل أوتوماتيك بين ملفات الفيديو المباشرة وروابط صفحات الـ HTML/iframe
    function renderSmartPlayer(url, container) {
      if (!url) return;
      
      // لو الرابط مباشر بصيغة فيديو
      if (url.includes('.mp4') || url.includes('.m3u8')) {
        container.innerHTML = `<video id="activeVideoPlayer" controls playsinline style="width:100%; height:100%; background:#000;"></video>`;
        const player = document.getElementById('activeVideoPlayer');
        player.src = url;
        player.load();
        player.play().catch(e => console.log("Autoplay blocked:", e));
      } else {
        // لو الرابط صفحة ويب أو إيمبد (iframe)
        container.innerHTML = `<iframe src="${url}" allowfullscreen style="width:100%; height:100%; border:none;"></iframe>`;
      }
    }

    function closeModal() {
      const player = document.getElementById('activeVideoPlayer');
      if (player) {
        player.pause();
      }
      document.getElementById('videoContainer').innerHTML = '';
      document.getElementById('modal').classList.remove('show');
    }
  </script>

</body>
</html>
